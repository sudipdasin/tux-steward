name: C++ VM validation
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  vm-validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: g++
            mode: Release
          - os: ubuntu-24.04
            compiler: clang++
            mode: Debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Retain the tested public foundation
        run: git merge-base --is-ancestor cdfdf7c0867e41af1220854306224dfa058aef89 HEAD
      - name: Use official Ubuntu mirrors on the disposable VM
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt
          fi
      - name: Install VM build and virtual desktop dependencies
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake g++ clang qtbase5-dev dpkg-dev file desktop-file-utils xvfb xauth
      - name: Build and test on the VM virtual X desktop
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DTUX_TEST_QPA_PLATFORM=xcb
          cmake --build build --parallel 2
          xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Package and verify
        run: |
          cpack --config build/CPackConfig.cmake
          cmake -DPACKAGE_DIR="$PWD/build/packages" -DRELEASE_VERSION="$(./build/tux-steward --version | awk '{print $NF}')" -P tests/verify_packages.cmake
      - name: Verify upgrade from the previous public beta
        run: |
          curl --fail --location --retry 3 --output /tmp/tux-steward-baseline.deb https://github.com/sudipdasin/tux-steward/releases/download/v0.9.0-beta.1/tux-steward_0.9.0.beta1_amd64.deb
          echo 'ad638c2fd1910b9886f031ee71546cef93b08bb3111447f81d38961c8b2c13f0  /tmp/tux-steward-baseline.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-baseline.deb
          tux-steward --version | grep -F '0.9.0-beta.1'
      - name: Verify upgrade through the 1.0 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v1.deb https://github.com/sudipdasin/tux-steward/releases/download/v1.0.0-beta.1/tux-steward_1.0.0.beta1_amd64.deb
          echo 'a14d946cbf8cea118f7d8b1ef11c44c42f794412bcbb55cbf73621adc1be41fb  /tmp/tux-steward-v1.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v1.deb
          tux-steward --version | grep -F '1.0.0-beta.1'
      - name: Verify upgrade through the 1.1 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v11.deb https://github.com/sudipdasin/tux-steward/releases/download/v1.1.0-beta.1/tux-steward_1.1.0.beta1_amd64.deb
          echo 'ad7ee00135eb52e82ec6d730a97a0ebf60aa057d4c89393e63657b8a0147f7d2  /tmp/tux-steward-v11.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v11.deb
          tux-steward --version | grep -F '1.1.0-beta.1'
      - name: Verify upgrade through the 1.2 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v12.deb https://github.com/sudipdasin/tux-steward/releases/download/v1.2.0-beta.1/tux-steward_1.2.0.beta1_amd64.deb
          echo '4cc03fc500650ff393a2084683c6527922a0080613eb2bf189864fcf61682a71  /tmp/tux-steward-v12.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v12.deb
          tux-steward --version | grep -F '1.2.0-beta.1'
      - name: Verify upgrade through the 1.3 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v13.deb https://github.com/sudipdasin/tux-steward/releases/download/v1.3.0-beta.1/tux-steward_1.3.0.beta1_amd64.deb
          echo '2ef209ca577bc866abd859119b6c7e57aa28b0c9d24c53af31a16b3e072195e4  /tmp/tux-steward-v13.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v13.deb
          tux-steward --version | grep -F '1.3.0-beta.1'
      - name: Verify upgrade through the 1.4 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v14.deb https://github.com/sudipdasin/tux-steward/releases/download/v1.4.0-beta.1/tux-steward_1.4.0.beta1_amd64.deb
          echo '00f17bb6720a0fd52516761b08390e966ec037bce2b06b7fa42b7dfa69d6de1c  /tmp/tux-steward-v14.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v14.deb
          tux-steward --version | grep -F '1.4.0-beta.1'
      - name: Verify upgrade through the 1.4.1 reliability beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v141.deb https://github.com/sudipdasin/tux-steward/releases/download/v1.4.1-beta.1/tux-steward_1.4.1.beta1_amd64.deb
          echo '3daaac7597e49778eddf158d433062dcd53516de0c6092a4731d5e96d59846c8  /tmp/tux-steward-v141.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v141.deb
          tux-steward --version | grep -F '1.4.1-beta.1'
      - name: Verify upgrade through the 2.0 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v2.deb https://github.com/sudipdasin/tux-steward/releases/download/v2.0.0-beta.1/tux-steward_2.0.0.beta1_amd64.deb
          echo 'c23b011a39c2c33c836ff34001ca3d062651078ec06ade159b6076085eb96f74  /tmp/tux-steward-v2.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v2.deb
          tux-steward --version | grep -F '2.0.0-beta.1'
      - name: Verify upgrade through the 2.1 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v21.deb https://github.com/sudipdasin/tux-steward/releases/download/v2.1.0-beta.1/tux-steward_2.1.0.beta1_amd64.deb
          echo 'bfcab97c4db7b440be51e5fdee72fee37d4b85220d93137decf92c177db10de3  /tmp/tux-steward-v21.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v21.deb
          tux-steward --version | grep -F '2.1.0-beta.1'
      - name: Verify upgrade through the 2.2 public beta
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output /tmp/tux-steward-v22.deb https://github.com/sudipdasin/tux-steward/releases/download/v2.2.0-beta.1/tux-steward_2.2.0.beta1_amd64.deb
          echo '88a4b4be5770eec1487e444bb823581c931970c848c592ccdca55b8d487cf66c  /tmp/tux-steward-v22.deb' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y /tmp/tux-steward-v22.deb
          tux-steward --version | grep -F '2.2.0-beta.1'
      - name: Install and launch all three native applications
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ./build/packages/*.deb
          for app in tux-steward tux-task-manager tux-setup; do
            "$app" --version
            result=0
            timeout 4s xvfb-run -a "$app" > "/tmp/${app}-smoke.log" 2>&1 || result=$?
            if [ "$result" -ne 124 ]; then cat "/tmp/${app}-smoke.log"; exit 1; fi
          done
          sudo apt-get remove -y tux-steward
          hash -r
          test ! -e /usr/bin/tux-steward
          test ! -e /usr/bin/tux-task-manager
          test ! -e /usr/bin/tux-setup
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-results-${{ matrix.os }}-${{ matrix.mode }}
          path: |
            build/Testing/Temporary/
            build/resource-details.png*
            build/ui-preview.png
            build/resource-details.png*
            build/ui-preview.png.report.png
            build/history-preview.png
            build/history-preview.png.triage.png
            build/cancel-preview.png
            build/report-selection-preview.png
            build/health-preview.png
            build/health-preview.png.recovery.png
