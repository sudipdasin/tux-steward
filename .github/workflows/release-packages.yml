name: Build release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Beta tag on main (created by the owner)
        required: true
        default: v1.3.0-beta.1
  push:
    tags: ["v*-beta.*"]
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  packages:
    needs: validate
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use official Ubuntu mirrors on the disposable VM
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt
          fi
      - name: Verify release tag and install build dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          git merge-base --is-ancestor cdfdf7c0867e41af1220854306224dfa058aef89 HEAD
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake g++ qtbase5-dev dpkg-dev file desktop-file-utils xvfb xauth
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTUX_TEST_QPA_PLATFORM=xcb
          cmake --build build --parallel 2
          xvfb-run -a ctest --test-dir build --output-on-failure
          test "v$(./build/tux-steward --version | awk '{print $NF}')" = "$RELEASE_TAG"
      - name: Package and verify
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cpack --config build/CPackConfig.cmake
          cmake -DPACKAGE_DIR="$PWD/build/packages" -DRELEASE_VERSION="${RELEASE_TAG#v}" -P tests/verify_packages.cmake
          for package in build/packages/*.deb; do
            safe=$(printf '%s' "$package" | tr '~' '.')
            if [ "$safe" != "$package" ]; then mv "$package" "$safe"; fi
          done
          cd build/packages
          sha256sum *.deb *.tar.gz > SHA256SUMS
      - name: Install, launch and uninstall package
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ./build/packages/*.deb
          tux-steward --version
          tux-task-manager --version
          for app in tux-steward tux-task-manager tux-setup; do
            result=0
            timeout 4s xvfb-run -a "$app" > "/tmp/${app}-smoke.log" 2>&1 || result=$?
            if [ "$result" -ne 124 ]; then cat "/tmp/${app}-smoke.log"; exit 1; fi
          done
          sudo apt-get remove -y tux-steward
          hash -r
          test ! -e /usr/bin/tux-steward
          test ! -e /usr/bin/tux-task-manager
          test ! -e /usr/bin/tux-setup
          ! command -v tux-steward
      - name: Publish verified testing preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Tux Steward ${RELEASE_TAG#v} — Public Testing Beta" --notes-file docs/RELEASE_NOTES.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = true
          gh release upload "$RELEASE_TAG" build/packages/*.deb build/packages/*.tar.gz build/packages/SHA256SUMS
