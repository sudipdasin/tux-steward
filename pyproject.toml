[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tux-steward"
version = "0.1.0"
description = "A deliberate, native Linux desktop maintenance toolkit"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Sudip Das"}]
dependencies = []

[project.scripts]
tux-steward = "tux_steward.app:main"

[tool.setuptools.packages.find]
include = ["tux_steward*"]
